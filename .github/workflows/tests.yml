name: Tests Robot Framework

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          rfbrowser init chromium

      - name: Choisir les tests selon le déclencheur
        if: github.event_name == 'pull_request'
        run: echo "TAG_OPTION=--include smoke" >> "$GITHUB_ENV"

      - name: Lancer les tests
        id: run
        continue-on-error: true
        run: >
          pabot --processes 4 --testlevelsplit
          --variablefile env/dev.py
          $TAG_OPTION --exclude wip
          --outputdir results tests/

      - name: Relancer les échecs
        if: steps.run.outcome == 'failure'
        run: |
          robot --rerunfailed results/output.xml --output rerun.xml \
            --variablefile env/dev.py --outputdir results tests/ || true
          rebot --merge --outputdir results --output output.xml \
            results/output.xml results/rerun.xml

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-robot
          path: results/

      - name: Résumé dans la page du build
        if: always()
        run: |
          python -c "
          from robot.api import ExecutionResult
          s = ExecutionResult('results/output.xml').statistics.total
          print(f'## Résultats Robot\n\n| Réussis | Échoués | Ignorés |\n|---|---|---|\n| {s.passed} | {s.failed} | {s.skipped} |')
          " >> "$GITHUB_STEP_SUMMARY"

  publier-rapport:
    needs: tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rapport-robot
          path: site

      - name: Faire du rapport la page d'accueil
        run: cp site/report.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4